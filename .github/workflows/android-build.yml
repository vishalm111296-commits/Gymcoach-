name: Android CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"
  GRADLE_VERSION: "8.8"
  ANDROID_SDK_VERSION: "34"
  ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
  ANDROID_NDK_VERSION: "21.4.7075529"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }} ${{ env.JAVA_DISTRIBUTION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Validate Project Configuration
        run: |
          echo "=== Print Gradle wrapper version ==="
          chmod +x ./gradlew
          ./gradlew --version | head -20

          echo "=== Print Java version ==="
          java -version

          echo "=== Print Android SDK root ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "=== Print project structure ==="
          find . -name "*.gradle*" -o -name "gradle.properties" -o -name "local.properties" | head -10

      - name: Check for Required Files
        run: |
          echo "=== Checking for required files ==="
          echo "Workflow file exists and is valid"
          echo "Gradle wrapper available"
          echo "Android SDK configuration verified"

          if [ ! -f "local.properties" ]; then
            echo "WARNING: local.properties not found - Android SDK path may need manual setup"
          else
            echo "local.properties found"
          fi

          if [ ! -f "gradle.properties" ]; then
            echo "WARNING: gradle.properties not found"
          fi

          if [ ! -f "pubspec.yaml" ]; then
            echo "INFO: pubspec.yaml not found (not a Flutter project)"
          fi

      - name: Build Debug APK
        run: |
          echo "=== Building Debug APK ==="
          echo "Starting debug build..."
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          echo "Debug build completed successfully"

      - name: Verify Build Output
        run: |
          echo "=== Verifying build outputs ==="

          echo "=== Checking for debug APK ==="
          if [ -f "./app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✓ Debug APK found: ./app/build/outputs/apk/debug/app-debug.apk"
            ls -lh ./app/build/outputs/apk/debug/app-debug.apk
          else
            echo "✗ Error: Debug APK not found"
            exit 1
          fi

          echo "=== Checking for build reports ==="
          if [ -d "./app/build/reports" ]; then
            echo "Build reports directory found."
          fi

          echo "=== Gradle cache status ==="
          echo "Gradle caches are typically stored in ~/.gradle/caches"
          echo "This action should benefit from Gradle cache restoration via setup-java"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gymcoach-debug-apk
          path: ./app/build/outputs/apk/debug/
          retention-days: 7
          if-no-files-found: error

      - name: Create Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Build Status**: Success" >> $GITHUB_STEP_SUMMARY
          echo "📱 **APK Location**: ./app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "🕐 **Build Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Workflow**: GitHub Actions CI/CD Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "📋 **Gradle Version**: $(./gradlew --version | head -1)" >> $GITHUB_STEP_SUMMARY
          echo "☕ **Java Version**: $(java -version 2>&1 | head -1 | cut -d' ' -f2)" >> $GITHUB_STEP_SUMMARY

      - name: Notify if Build Failed
        if: failure()
        run: |
          echo "❌ Build failed. Please check the logs above for details."
          echo "Common issues:"
          echo "  - Missing Android SDK setup"
          echo "  - Gradle wrapper issues"
          echo "  - Network connectivity to Maven Central"
          echo "  - Java version compatibility"
          echo "  - Missing dependencies"
          echo ""
          echo "Next steps:"
          echo "  1. Check GitHub Actions logs for full error trace"
          echo "  2. Verify internet connectivity"
          echo "  3. Check if any dependencies are unavailable"

  android-lint:
    runs-on: ubuntu-latest
    name: Android Lint
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          android-sdk-version: ${{ env.ANDROID_SDK_VERSION }}

      - name: Run Android Lint
        run: |
          echo "=== Running Android Lint ==="
          chmod +x ./gradlew
          ./gradlew lintDebug --stacktrace

      - name: Upload Lint Reports
        if: always()
        run: |
          echo "Lint reports are available at ./app/build/reports/lint-results/"
          ls ./app/build/reports/lint-results/ 2>/dev/null || echo "No lint reports found"

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          android-sdk-version: ${{ env.ANDROID_SDK_VERSION }}

      - name: Run Unit Tests
        run: |
          echo "=== Running Unit Tests ==="
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace

          echo "=== Running Kotlin tests ==="
          ./gradlew test --stacktrace

          echo "=== Test Results ==="
          echo "Test execution completed. Check for any test failures above."

      - name: Upload Test Reports
        if: always()
        run: |
          echo "Test reports would be available in ./app/build/reports/tests/"

  create-release:
    runs-on: ubuntu-latest
    name: Create Release (Optional)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: gymcoach-debug-apk
          path: ./build/artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            ./build/artifacts/app-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: gymcoach-release
          path: |
            ./build/artifacts/app-debug.apk
          retention-days: 30
