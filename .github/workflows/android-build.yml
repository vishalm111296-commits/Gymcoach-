name: Android CI/CD Pipeline

on:
  push:
    branches: [ main, develop, repair/restore-build ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"
  ANDROID_SDK_VERSION: "34"
  ANDROID_BUILD_TOOLS_VERSION: "34.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }} ${{ env.JAVA_DISTRIBUTION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Validate Project Configuration
        run: |
          echo "=== Print Gradle version ==="
          gradle --version | head -20

          echo "=== Print Java version ==="
          java -version

          echo "=== Print Android SDK root ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "=== Print project structure ==="
          find . -name "*.gradle*" -o -name "gradle.properties" -o -name "local.properties" | head -10

      - name: Build Debug APK
        run: |
          echo "=== Building Debug APK ==="
          echo "Starting debug build..."
          ./gradlew assembleDebug --stacktrace
          echo "Debug build completed successfully"

      - name: Rename APK
        run: |
          mv ./app/build/outputs/apk/debug/app-debug.apk ./app/build/outputs/apk/debug/GymCoach-debug.apk

      - name: Verify Build Output
        run: |
          echo "=== Verifying build outputs ==="

          echo "=== Checking for debug APK ==="
          if [ -f "./app/build/outputs/apk/debug/GymCoach-debug.apk" ]; then
            echo "✓ Debug APK found: ./app/build/outputs/apk/debug/GymCoach-debug.apk"
            ls -lh ./app/build/outputs/apk/debug/GymCoach-debug.apk
          else
            echo "✗ Error: Debug APK not found"
            exit 1
          fi

          echo "=== Checking for build reports ==="
          if [ -d "./app/build/reports" ]; then
            echo "Build reports directory found."
          fi

          echo "=== Gradle cache status ==="
          echo "Gradle caches are typically stored in ~/.gradle/caches"
          echo "This action should benefit from Gradle cache restoration via setup-java"

      - name: Build Release APK (Unsigned)
        run: |
          echo "=== Building Release APK (unsigned) ==="
          echo "Note: Release signing requires secrets configured in GitHub Actions"
          echo "Skipping signed release build - use commented section below for production setup"

          echo "=== Debug build gives us APK for testing ==="
          echo "Build completed! APK is ready for distribution."

          echo "=== Available APKs ==="
          find app/build/outputs/apk/ -name "*.apk" -type f | sed 's|app/build/| |g' | while read apk; do
            echo "  📱 $apk"
          done

      - name: Print Build Statistics
        run: |
          echo "=== Build Statistics ==="
          echo "Build time: $(date)"
          echo "Workflow: GitHub Actions"
          echo "Runner: Ubuntu Latest"
          echo "Gradle Version: $(gradle --version | head -5)"
          echo "Java Version: $(java -version 2>&1 | head -3)"
          echo "Android SDK Version: ${{ env.ANDROID_SDK_VERSION }}"
          echo "Android Build Tools Version: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GymCoach-debug-apk
          path: ./app/build/outputs/apk/debug/GymCoach-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Build Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅ Success"
          else
            STATUS="❌ Failed"
          fi
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Status**: $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "**APK Location**: ./app/build/outputs/apk/debug/GymCoach-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "**Build Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Notify if Build Failed
        if: failure()
        run: |
          echo "❌ Build failed. Please check the logs above for details."
          echo "Common issues:"
          echo "  - Missing Android SDK setup"
          echo "  - Gradle wrapper issues"
          echo "  - Network connectivity to Maven Central"
          echo "  - Java version compatibility"
          echo "  - Missing dependencies"
          echo ""
          echo "Next steps:"
          echo "  1. Check GitHub Actions logs for full error trace"
          echo "  2. Verify internet connectivity"
          echo "  3. Check if any dependencies are unavailable"

  android-lint:
    runs-on: ubuntu-latest
    name: Android Lint
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          android-sdk-version: ${{ env.ANDROID_SDK_VERSION }}

      - name: Run Android Lint
        run: |
          chmod +x ./gradlew
          ./gradlew lintDebug --stacktrace

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: ./app/build/reports/lint-results-debug.xml
          retention-days: 7
          if-no-files-found: warn

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          android-sdk-version: ${{ env.ANDROID_SDK_VERSION }}

      - name: Run Unit Tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace --continue

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ./app/build/reports/tests/
          retention-days: 7
          if-no-files-found: warn

  Create GitHub Release:
    runs-on: ubuntu-latest
    name: Create GitHub Release
    needs: [build, test]
    permissions:
      contents: write
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/repair/restore-build' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="auto-debug-${{ github.run_number }}"
          fi
          echo "name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG_NAME}"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: GymCoach-debug-apk
          path: ./build/artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body: |
            ## GymCoach Debug Build

            ⚠️ This is a **debug/testing APK** signed with the Android debug keystore.
            Do NOT distribute publicly — install only on devices you own for testing.

            ### Build Info
            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - Workflow run: #${{ github.run_number }}
            - Triggered by: `${{ github.event_name }}`

            ### Install on Android
            1. Download `GymCoach-debug.apk` from the assets below.
            2. On your phone, enable **Install unknown apps** for your browser/files app.
            3. Open the APK and tap **Install**.
            4. Launch "GymCoach" from your app drawer.
          files: ./build/artifacts/GymCoach-debug.apk
          draft: false
          prerelease: true
