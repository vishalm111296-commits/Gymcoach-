name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show toolchain
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Lint (record result)
        run: |
          mkdir -p ci-status
          ./gradlew lintDebug --stacktrace > ci-status/lint.log 2>&1 && echo PASS > ci-status/lint.result || { echo FAIL > ci-status/lint.result; { grep -E "^(e: |error: )" ci-status/lint.log | head -60; echo '--- last lines ---'; tail -15 ci-status/lint.log; } > ci-status/lint.tail; }

      - name: Unit tests (record result)
        run: |
          ./gradlew testDebugUnitTest --stacktrace > ci-status/test.log 2>&1 && echo PASS > ci-status/test.result || { echo FAIL > ci-status/test.result; { grep -E "^(e: |error: )" ci-status/test.log | head -60; echo '--- last lines ---'; tail -15 ci-status/test.log; } > ci-status/test.tail; }

      - name: Assemble debug APK (record result)
        run: |
          ./gradlew assembleDebug --stacktrace > ci-status/build.log 2>&1 && echo PASS > ci-status/build.result || { echo FAIL > ci-status/build.result; { grep -E "^(e: |error: )" ci-status/build.log | head -60; echo '--- last lines ---'; tail -15 ci-status/build.log; } > ci-status/build.tail; }

      - name: Fail if any check failed
        run: |
          failed=0
          for r in ci-status/*.result; do
            [ "$(cat "$r")" = "FAIL" ] && { failed=1; echo "CHECK FAILED: $r"; }
          done
          exit $failed

      - name: Publish CI run report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-status
          {
            echo "## CI Run Report"
            echo ""
            echo "- Commit: ${{ github.sha }}"
            echo "- Branch: ${{ github.ref_name }}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            for check in lint test build; do
              f="ci-status/${check}.result"
              if [ -f "$f" ]; then
                res=$(cat "$f")
                echo "- ${check}: ${res}"
                tailf="ci-status/${check}.tail"
                if [ "$res" = "FAIL" ] && [ -f "$tailf" ]; then
                  echo ""
                  echo "<details><summary>${check} failure tail</summary>"
                  echo ""
                  echo '```'
                  tail -60 "$tailf"
                  echo '```'
                  echo "</details>"
                fi
              fi
            done
          } > ci-status/report.md
          gh label create ci-run-report --color 0E8A16 --force || true
          issue_num=$(gh issue list --search "[ci-run-report]" --state open --json number --limit 1 --jq '.[0].number // empty')
          if [ -n "$issue_num" ]; then
            gh issue comment "$issue_num" --body-file ci-status/report.md
          else
            gh issue create --title "[ci-run-report] GymCoach CI results" --body-file ci-status/report.md
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: |
            app/build/outputs/apk/debug/
            app/build/reports/tests/
            ci-status/
          retention-days: 7
          if-no-files-found: ignore
