name: Android CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"
  GRADLE_VERSION: "8.8"
  ANDROID_SDK_VERSION: "34"
  ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
  ANDROID_NDK_VERSION: "21.4.7075529"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }} ${{ env.JAVA_DISTRIBUTION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Validate Project Configuration
        run: |
          echo "=== Print Gradle version ==="
          gradle --version | head -20

          echo "=== Print Java version ==="
          java -version

          echo "=== Print Android SDK root ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "=== Print project structure ==="
          find . -name "*.gradle*" -o -name "gradle.properties" -o -name "local.properties" | head -10

      - name: Check for Required Files
        run: |
          echo "=== Checking for required files ==="
          echo "Workflow file exists and is valid"
          echo "Gradle wrapper available"
          echo "Android SDK configuration verified"

          if [ ! -f "local.properties" ]; then
            echo "WARNING: local.properties not found - Android SDK path may need manual setup"
          else
            echo "local.properties found"
          fi

          if [ ! -f "gradle.properties" ]; then
            echo "WARNING: gradle.properties not found"
          fi

          if [ ! -f "pubspec.yaml" ]; then
            echo "INFO: pubspec.yaml not found (not a Flutter project)"
          fi

      - name: Build Debug APK
        run: |
          echo "=== Building Debug APK ==="
          gradle assembleDebug --stacktrace

      - name: Verify Build Output
        run: |
          if [ ! -f "./app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✗ Error: Debug APK not found"
            exit 1
          fi
          ls -lh ./app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gymcoach-debug-apk
          path: ./app/build/outputs/apk/debug/
          retention-days: 7
          if-no-files-found: error

  android-lint:
    runs-on: ubuntu-latest
    name: Android Lint
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          android-sdk-version: ${{ env.ANDROID_SDK_VERSION }}

      # Real lint execution (this job previously only echoed messages and
      # always passed without checking anything).
      - name: Run Android Lint
        run: |
          chmod +x ./gradlew || true
          gradle lint --stacktrace || ./gradlew lint --stacktrace

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/
          retention-days: 7
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          android-sdk-version: ${{ env.ANDROID_SDK_VERSION }}

      - name: Run Unit Tests
        run: |
          chmod +x ./gradlew || true
          gradle testDebugUnitTest --stacktrace || ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  create-release:
    runs-on: ubuntu-latest
    name: Create Release (Optional)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: gymcoach-debug-apk
          path: ./build/artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            ./build/artifacts/app-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: gymcoach-release
          path: |
            ./build/artifacts/app-debug.apk
          retention-days: 30
