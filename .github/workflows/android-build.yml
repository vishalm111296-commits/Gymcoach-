name: Android CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"
  ANDROID_SDK_VERSION: "36"
  ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
  ANDROID_NDK_VERSION: "21.4.7075529"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }} ${{ env.JAVA_DISTRIBUTION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-36" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Validate Project Configuration
        run: |
          echo "=== Print Gradle wrapper version ==="
          chmod +x ./gradlew
          ./gradlew --version | head -20

          echo "=== Print Java version ==="
          java -version

          echo "=== Print Android SDK root ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Setup Keystore and Build APKs and Bundles
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "=== Preparing Build Environment ==="
          chmod +x ./gradlew

          TEMP_KEYSTORE_DIR="$RUNNER_TEMP/signing"
          mkdir -p "$TEMP_KEYSTORE_DIR"
          KEYSTORE_FILE="$TEMP_KEYSTORE_DIR/release.jks"

          cleanup() {
            if [ -d "$TEMP_KEYSTORE_DIR" ]; then
              echo "Securely removing temporary keystore directory..."
              rm -rf "$TEMP_KEYSTORE_DIR"
            fi
          }
          trap cleanup EXIT

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Production keystore secret detected. Decoding to temporary location..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            export KEYSTORE_PATH="$KEYSTORE_FILE"
            echo "KEYSTORE_PATH set. Running assembleRelease and bundleRelease..."
            ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace
          else
            echo "No KEYSTORE_BASE64 secret provided."
            if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
              echo "FATAL: Tagged release build requires KEYSTORE_BASE64 secret!"
              exit 1
            fi
            echo "Proceeding with assembleDebug, assembleRelease, and bundleRelease (unsigned release)..."
            ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace
          fi

      - name: Release Artifact Forensics & Signing Verification
        run: |
          echo "=== Release Artifact Forensics ==="
          if [ -f "./app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            echo "Found unsigned release APK:"
            ls -lh ./app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          if [ -f "./app/build/outputs/apk/release/app-release.apk" ]; then
            echo "Found release APK:"
            ls -lh ./app/build/outputs/apk/release/app-release.apk

            # Signing verification using apksigner
            APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ]; then
              echo "Verifying release APK with $APKSIGNER..."
              SIGN_INFO=$($APKSIGNER verify --verbose ./app/build/outputs/apk/release/app-release.apk 2>&1 || true)
              echo "$SIGN_INFO"
              if echo "$SIGN_INFO" | grep -q "CN=Android Debug"; then
                echo "FATAL: Release APK is signed with Android Debug certificate!"
                exit 1
              fi
            fi
          fi

          if [ -f "./app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "Found release AAB:"
            ls -lh ./app/build/outputs/bundle/release/app-release.aab
          fi

      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gymcoach-debug-apk
          path: ./app/build/outputs/apk/debug/
          retention-days: 7
          if-no-files-found: error

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gymcoach-release-apk
          path: ./app/build/outputs/apk/release/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: gymcoach-release-bundle
          path: ./app/build/outputs/bundle/release/
          retention-days: 7
          if-no-files-found: warn

      - name: Create Build Summary
        if: success()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Build Status**: Success" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Target SDK**: 36 | **Compile SDK**: 36" >> $GITHUB_STEP_SUMMARY
          echo "🕐 **Build Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Workflow**: GitHub Actions CI/CD Pipeline" >> $GITHUB_STEP_SUMMARY

  android-lint:
    runs-on: ubuntu-latest
    name: Android Lint
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Run Android Lint
        run: |
          echo "=== Running Android Lint ==="
          chmod +x ./gradlew
          ./gradlew lintDebug --stacktrace

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: ./app/build/reports/
          retention-days: 7
          if-no-files-found: warn

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Run Unit Tests
        run: |
          echo "=== Running Unit Tests ==="
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: ./app/build/reports/tests/
          retention-days: 7
          if-no-files-found: warn

  create-release:
    runs-on: ubuntu-latest
    name: Create Release
    needs: [build, test, android-lint]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: gymcoach-release-apk
          path: ./build/artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./build/artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
