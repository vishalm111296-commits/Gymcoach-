name: Android CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"
  ANDROID_SDK_VERSION: "36"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_NDK_VERSION: "21.4.7075529"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }} ${{ env.JAVA_DISTRIBUTION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          echo "=== Android SDK Diagnostic ==="
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          sdkmanager --version || true
          echo "=== Installing Required Packages ==="
          yes | sdkmanager "platform-tools" "platforms;android-36" "platforms;android-34" "build-tools;35.0.0" || {
            echo "FATAL: Failed to install Android SDK packages via sdkmanager"
            exit 1
          }
          echo "=== Accepting Licenses ==="
          yes | sdkmanager --licenses || true

      - name: Validate Project Configuration
        run: |
          echo "=== Print Gradle wrapper version ==="
          chmod +x ./gradlew
          ./gradlew --version | head -20

      - name: Build and Sign APK / AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "=== Build Step ==="

          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "Tag pushed: Verifying secrets for production build..."
            if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "FATAL: Tagged release requires KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets."
              exit 1
            fi

            echo "Production keystore secrets detected. Decoding to temporary location..."
            TEMP_KEYSTORE_DIR=$(mktemp -d)
            KEYSTORE_FILE="$TEMP_KEYSTORE_DIR/keystore.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            export KEYSTORE_PATH="$KEYSTORE_FILE"
            echo "KEYSTORE_PATH set. Running assembleRelease and bundleRelease..."

            # Using try-catch pattern via trap for cleanup
            cleanup() {
              if [ -d "$TEMP_KEYSTORE_DIR" ]; then
                echo "Securely removing temporary keystore directory..."
                rm -rf "$TEMP_KEYSTORE_DIR"
              fi
            }
            trap cleanup EXIT

            ./gradlew assembleRelease bundleRelease --stacktrace
          else
            echo "Non-tag push: Proceeding with assembleDebug only."
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Release Artifact Forensics & Signing Verification
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
        run: |
          echo "=== Release Artifact Forensics ==="

          if [ ! -f "./app/build/outputs/apk/release/app-release.apk" ]; then
            echo "FATAL: Tagged build requires signed app-release.apk, but file was not produced!"
            exit 1
          fi

          echo "Found release APK:"
          ls -lh ./app/build/outputs/apk/release/app-release.apk

          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "FATAL: apksigner binary not found in Android SDK build-tools!"
            exit 1
          fi

          echo "Verifying release APK with $APKSIGNER..."
          if ! SIGN_INFO=$("$APKSIGNER" verify --verbose --print-certs ./app/build/outputs/apk/release/app-release.apk 2>&1); then
            echo "FATAL: apksigner verification failed!"
            echo "$SIGN_INFO"
            exit 1
          fi
          echo "$SIGN_INFO"

          if echo "$SIGN_INFO" | grep -q "CN=Android Debug"; then
            echo "FATAL: Release APK is signed with Android Debug certificate!"
            exit 1
          fi

          if ! echo "$SIGN_INFO" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"; then
            echo "FATAL: Release APK is not signed with APK Signature Scheme v2!"
            exit 1
          fi
          echo "✅ Release APK signature verified successfully."

          CERT_SHA256=$(echo "$SIGN_INFO" | grep -i "SHA-256 digest:" | head -n 1 | awk '{print $NF}')
          echo "Release APK Certificate SHA-256: $CERT_SHA256"

          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            echo "Validating certificate fingerprint against expected repository variable EXPECTED_CERT_SHA256..."
            if [ "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
              echo "FATAL: Certificate SHA-256 ($CERT_SHA256) does not match expected repository variable ($EXPECTED_CERT_SHA256)!"
              exit 1
            fi
            echo "✅ Certificate fingerprint matched expected repository variable."
          else
            echo "Certificate fingerprint pinning check skipped: EXPECTED_CERT_SHA256 repository variable not set."
          fi

          if [ ! -f "./app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "FATAL: Tagged build requires app-release.aab, but file was not produced!"
            exit 1
          fi

          echo "Found release AAB:"
          ls -lh ./app/build/outputs/bundle/release/app-release.aab

          echo "=== Verifying Release AAB Signature ==="
          if ! jarsigner -verify -verbose -certs ./app/build/outputs/bundle/release/app-release.aab; then
            echo "FATAL: jarsigner verification failed for AAB!"
            exit 1
          fi
          echo "✅ Release AAB signature verified successfully."

          echo "=== Verifying Release AAB Structure ==="
          unzip -l ./app/build/outputs/bundle/release/app-release.aab > /tmp/aab_contents.txt

          if grep -q "base/dex/classes.dex" /tmp/aab_contents.txt; then
            echo "✅ AAB contains base/dex/classes.dex"
          else
            echo "FATAL: AAB missing base/dex/classes.dex!"
            exit 1
          fi

          if grep -q "base/manifest/AndroidManifest.xml" /tmp/aab_contents.txt; then
            echo "✅ AAB contains base/manifest/AndroidManifest.xml"
          else
            echo "FATAL: AAB missing base/manifest/AndroidManifest.xml!"
            exit 1
          fi

          echo "=== Verifying R8 Minification ==="
          if [ ! -f "./app/build/outputs/mapping/release/mapping.txt" ]; then
            echo "FATAL: mapping.txt not found! R8 minification may not have run."
            exit 1
          fi
          if [ ! -s "./app/build/outputs/mapping/release/mapping.txt" ]; then
             echo "FATAL: mapping.txt is empty! R8 minification did not obfuscate code."
             exit 1
          fi
          echo "✅ R8 minification verified (mapping.txt exists and is non-empty)."

      - name: Upload Final Release AAB (Tagged Releases Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v5
        with:
          name: gymcoach-final-aab
          path: ./app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Create Build Summary
        if: success()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Build Status**: Success" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Target SDK**: 36 | **Compile SDK**: 36" >> $GITHUB_STEP_SUMMARY
          echo "🕐 **Build Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Workflow**: GitHub Actions CI/CD Pipeline" >> $GITHUB_STEP_SUMMARY

  android-lint:
    runs-on: ubuntu-latest
    name: Android Lint
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          echo "=== Android SDK Diagnostic (Lint) ==="
          sdkmanager --version || true
          yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" || {
            echo "FATAL: Failed to install Android SDK packages in lint job"
            exit 1
          }
          yes | sdkmanager --licenses || true

      - name: Run Android Lint
        run: |
          echo "=== Running Android Lint ==="
          chmod +x ./gradlew
          ./gradlew lintDebug --stacktrace

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          echo "=== Android SDK Diagnostic (Tests) ==="
          sdkmanager --version || true
          yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" || {
            echo "FATAL: Failed to install Android SDK packages in test job"
            exit 1
          }
          yes | sdkmanager --licenses || true

      - name: Run Unit Tests
        run: |
          echo "=== Running Unit Tests ==="
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace

  instrumentation-tests:
    runs-on: ubuntu-latest
    name: Connected Instrumentation Tests
    needs: build
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Connected Instrumentation Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew connectedDebugAndroidTest --continue --stacktrace

  create-release:
    runs-on: ubuntu-latest
    name: Create Release
    needs: [build, test, android-lint, instrumentation-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Final Release AAB
        uses: actions/download-artifact@v5
        with:
          name: gymcoach-final-aab
          path: ./build/artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./build/artifacts/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
